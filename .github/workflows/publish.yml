name: Publish to Docker Hub and GHCR

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      package_version: ${{ steps.release.outputs.package_version }}
      revision: ${{ steps.release.outputs.revision }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_IMAGE" ]]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_IMAGE in repository Actions variables."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"

      - name: Validate application versions
        id: release
        run: |
          {
            just release-check "$GITHUB_REF_NAME"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Release acceptance
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish multi-platform images
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Set up arm64 build emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image tags and OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKERHUB_IMAGE }}
            ${{ needs.validate.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=sha-${{ needs.validate.outputs.revision }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.stable }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.revision }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate.outputs.package_version }}
            REVISION=${{ needs.validate.outputs.revision }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: mode=max
          sbom: true

      - name: Record image references
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          GHCR_IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf 'Published image references\n\n'
            for image_ref in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
              printf -- '- %s:%s\n- %s:sha-%s\n- %s@%s\n\n' \
                "$image_ref" "$VERSION" "$image_ref" "$REVISION" "$image_ref" "$DIGEST"
            done
          } >> "$GITHUB_STEP_SUMMARY"
