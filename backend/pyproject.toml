[project]
name = "rabbitmq-topology-analyzer-backend"
version = "0.1.0"
description = "FastAPI backend for the RabbitMQ topology visualization tool."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "rabbitmq-management-sdk==0.5.0",
    "pyjwt[crypto]>=2.15.1,<3",
    "argon2-cffi>=25.1,<26",
    "httpx2>=2.16.0,<3",
    "authlib>=1.9.5,<2",
]

[dependency-groups]
build = ["hatchling==1.32.4"]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0,<1.0.0",
    "pytest>=9.1",
    "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src", ".", ".."]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"
required-version = ">=0.17.0,<1.0.0"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # import ordering
    "B", # likely bugs
    "C4", # unnecessary comprehensions
    "UP", # modern Python syntax
    "SIM", # simplifications
    "TCH", # type-only imports
    "ANN", # missing annotations
    "PTH", # pathlib over os.path
    "PL", # Pylint-quality rules
    "RUF", # Ruff-specific rules
    "TID", # import hygiene
    "D", # docstrings
]

[tool.ruff.lint.isort]
known-first-party = ["access", "analyses", "auth", "core", "cycles", "definitions", "jobs", "scc", "topology"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["D104"]
"tests/**/*.py" = ["D", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "src/main.py",
    "src/access",
    "src/analyses",
    "src/auth",
    "src/core",
    "src/cycles",
    "src/definitions",
    "src/jobs",
    "src/scc",
    "src/topology",
    "static",
]
sources = ["src"]
